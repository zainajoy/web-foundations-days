
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Load Users</title>
    <script src="users.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f6fa;
            color: #222;
        }

        header, main {
            background-color: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background-color: #304a72;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
  
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font: inherit;
        }

        .user-card {
            padding: 15px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .user-card h3 {
            margin-top: 0;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Day 5: User Directory</h1>
        <p>Load users from a REST API and filter them by name.</p>
    </header>

    <main>
        <button id="load-users" type="button">Load Users</button>

        <p id="status" role="status" aria-live="polite">Click "Load Users" to begin.</p>

        <label for="filter-input">Filter users by name:</label>
        <input
            id="filter-input"
            type="text"
            placeholder="Start typing a name..."
        >

        <ul id="users-list"></ul>
    </main>
</body>
</html>
